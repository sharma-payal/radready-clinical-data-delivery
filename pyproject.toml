[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radready"
version = "0.1.0"
description = "A synthetic longitudinal radiology dataset delivery and quality-control simulator"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
radready = "radready.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
